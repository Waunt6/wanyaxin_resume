<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>万雅欣 Ayla · 小猫侦探</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="stage">
  <canvas id="world"></canvas>
  <div id="layer"></div>
  <div id="hint" class="hint"></div>
</div>

<button id="guide" class="guide"><span class="arrow"></span><em></em></button>

<div id="bubble" class="bubble"><span></span></div>

<header id="topbar">
  <nav id="chapters"></nav>
</header>

<footer id="hud">
  <span class="tip" id="tip"></span>
  <span class="count" id="count"></span>
</footer>

<div id="loading" class="loading">
  <div class="lbox">
    <span class="ld"></span><span class="ld"></span><span class="ld"></span>
    <p id="loadingTxt">推开城堡的门…</p>
  </div>
</div>

<div id="tvzoom" class="tvzoom">
  <div class="tvset">
    <div class="tvscreen" id="tvScreen">
      <div class="snow" id="tvSnow"></div>
      <div class="desktop" id="desktop">
        <div class="icons" id="tvIcons"></div>
        <div class="win" id="tvWin">
          <div class="win-bar">
            <span id="winTitle"></span>
            <i class="win-btns"><b>_</b><b>□</b><b id="winClose">✕</b></i>
          </div>
          <div class="win-body" id="winBody"></div>
        </div>
      </div>
      <div class="flash" id="tvFlash"></div>
    </div>
    <img class="tvshell" src="assets/tv.png" alt="">
  </div>
  <button class="closebtn" id="tvClose">关掉电视 ✕</button>
</div>

<div id="bookzoom" class="bookzoom">
  <div class="bookwrap">
    <p class="booktip"><i>✳</i> 右边那五张索引贴，点一下翻到别的爱好</p>
    <div class="book">
      <img class="spread" id="bookImg" alt="">
      <div class="tabs" id="bookTabs"></div>
    </div>
  </div>
  <button class="closebtn" id="bookClose">合上这本书 ✕</button>
</div>

<div id="cardzoom" class="cardzoom">
  <div class="cardwrap">
    <img class="namecard" id="namecardImg" alt="">
    <p class="cardnote" id="cardNote"></p>
  </div>
  <button class="closebtn" id="cardClose">放回去 ✕</button>
</div>

<script src="js/cat.js?v=5"></script>
<script src="js/content.js"></script>
<script src="js/app.js"></script>
</body>
</html>
